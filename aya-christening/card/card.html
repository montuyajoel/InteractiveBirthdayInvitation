<!doctype html>
<!-- Source of the invitation card image (src/assets/invitation-card.jpg).
     To change it: edit here, then render at 960x1440 and install with
     scripts/new_event.py's install_card (see README "Invitation card"). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:960px;height:1440px}
  body{font-family:Lora,Georgia,serif;color:#4a2832;position:relative;overflow:hidden;
    background:
      radial-gradient(520px 380px at 10% 6%,#fbecdc,transparent 70%),
      radial-gradient(520px 420px at 95% 40%,#f8e1e6,transparent 70%),
      radial-gradient(560px 420px at 20% 100%,#f8e1e6,transparent 70%),
      radial-gradient(circle at 9px 11px,rgba(212,175,55,.55) 1.6px,transparent 2.2px) 0 0/58px 58px,
      radial-gradient(circle at 40px 44px,rgba(163,90,106,.35) 1.8px,transparent 2.4px) 0 0/78px 78px,
      radial-gradient(circle at 66px 18px,rgba(212,175,55,.4) 1.2px,transparent 1.8px) 0 0/92px 92px,
      #fffaf8}
  .frame{position:absolute;inset:40px;border:4px solid transparent;border-radius:24px;
    background:linear-gradient(120deg,#c9a24a,#f3dc9a 25%,#b8862f 45%,#e7b9a9 60%,#c9a24a 80%,#f3dc9a) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .frame2{position:absolute;inset:60px;border:1.5px solid rgba(201,162,74,.6);border-radius:16px}
  .foil{background:linear-gradient(110deg,#a35a6a 0%,#9a6a1f 22%,#c9a24a 32%,#a35a6a 48%,#9c4f62 62%,#9a6a1f 80%,#b8862f 88%,#a35a6a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .18em .12em;margin:0 -.18em}
  .gl{position:absolute;width:var(--s);height:var(--s)}
  .c{position:absolute;left:0;right:0;text-align:center}
  .eyebrow{letter-spacing:.32em;text-transform:uppercase;color:#a35a6a;font-size:26px;font-weight:500}
  .script{font-family:'Great Vibes',cursive;color:#a35a6a;line-height:1}
  svg{position:absolute}
</style></head><body>
<div class="frame"></div><div class="frame2"></div>
