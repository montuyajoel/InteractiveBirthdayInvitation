<html><head><meta charset="utf-8">

<style>

      radial-gradient(560px 420px at 20% 100%,#f7e3ea,transparent 70%),

  .frame2{position:absolute;inset:58px;border:1px solid rgba(169,77,112,.35);border-radius:16px}
  .c{position:absolute;left:0;right:0;text-align:center}
  .eyebrow{letter-spacing:.32em;text-transform:uppercase;color:#a94d70;font-size:26px;font-weight:500}
  .script{font-family:'Great Vibes',cursive;color:#a94d70;line-height:1}
  svg{position:absolute}
</style></head><body>
