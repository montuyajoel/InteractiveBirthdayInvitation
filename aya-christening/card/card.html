<!doctype html>
<!-- Source of the invitation card image (src/assets/invitation-card.jpg),
     styled after an arch-top welcome sign with a balloon garland.
     To change it: edit here, render at 960x1440 (e.g. a Playwright
     screenshot), then install it with the skill's install_card(). -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:960px;height:1440px}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:#4f3426;position:relative;overflow:hidden;font-variant-numeric:lining-nums;
    background:
      radial-gradient(600px 480px at 15% 10%,#f6eadf,transparent 70%),
      radial-gradient(560px 520px at 90% 60%,#f1ddd8,transparent 70%),
      radial-gradient(700px 400px at 50% 110%,#ecd6cf,transparent 70%),
      radial-gradient(circle at 9px 11px,rgba(201,164,92,.45) 1.4px,transparent 2px) 0 0/64px 64px,
      #f8efe7}
  .sign{position:absolute;left:150px;top:150px;width:660px;height:1190px;border-radius:330px 330px 26px 26px;
    background:linear-gradient(180deg,#fffdf9,#fbf5ee);box-shadow:0 30px 60px -30px rgba(79,52,38,.45)}
  .sign:after{content:"";position:absolute;inset:18px;border-radius:312px 312px 14px 14px;border:2px solid rgba(201,164,92,.75)}
  .c{position:absolute;left:150px;width:620px;text-align:center}
  .caps{letter-spacing:.3em;text-transform:uppercase;font-weight:600;color:#8c6a45}
  .script{font-family:Allura,cursive;line-height:1}
  .foil{background:linear-gradient(110deg,#8c6a45 0%,#8c6a45 30%,#b08a4e 42%,#c9a45c 48%,#b08a4e 54%,#8c6a45 66%,#8c6a45 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;padding:.14em .18em .12em;margin:0 -.18em}
  svg{position:absolute;overflow:visible}
  .rule{position:absolute;height:2px;background:linear-gradient(90deg,transparent,#c9a45c,transparent)}
</style></head><body>
<div class="sign"></div>
<svg id="decor" width="960" height="1440" style="left:0;top:0"></svg>

<svg viewBox="0 0 24 32" style="left:442px;top:250px;width:36px"><path d="M12 2v28M4 10h16" stroke="#c9a45c" stroke-width="2.4" stroke-linecap="round"/></svg>
<div class="c caps" style="top:318px;font-size:30px">You're invited to</div>
<div class="c script" style="top:362px;font-size:76px;color:#8c6a45">the Christening of</div>
<div class="c script" style="top:494px;font-size:122px;white-space:nowrap"><span class="foil">Avrielle Noel</span></div>
<div class="c" style="top:650px;font-style:italic;font-size:40px;color:#8c6a45">“Aya”</div>
<div class="rule" style="left:310px;width:130px;top:744px"></div>
<div class="rule" style="left:480px;width:130px;top:744px"></div>
<svg viewBox="0 0 24 24" style="left:448px;top:732px;width:24px"><path d="M12 20.5s-7.5-4.6-7.5-10.2C4.5 7.4 6.6 5.5 9 5.5c1.4 0 2.5.7 3 1.7.5-1 1.6-1.7 3-1.7 2.4 0 4.5 1.9 4.5 4.8 0 5.6-7.5 10.2-7.5 10.2z" fill="#c4959a"/></svg>

<!-- two columns, like the sign -->
<svg viewBox="0 0 24 32" style="left:290px;top:800px;width:34px"><path d="M12 2v28M4 10h16" stroke="#8c6a45" stroke-width="2.4" stroke-linecap="round"/></svg>
<div style="position:absolute;left:190px;width:236px;top:860px;text-align:center" class="caps"><div style="font-size:24px;line-height:1.5">Baptized<br>in His love</div></div>
<div style="position:absolute;left:459px;top:806px;width:2px;height:170px;background:rgba(201,164,92,.6)"></div>
<div style="position:absolute;left:480px;width:260px;top:806px;text-align:center">
  <div class="caps" style="font-size:24px;line-height:1.5">Sunday</div>
  <div style="font-size:40px;font-weight:600;letter-spacing:.06em">December 20</div>
  <div class="caps" style="font-size:24px;line-height:1.5">2026</div>
  <div class="caps" style="font-size:24px;line-height:1.5;color:#4f3426">10:00 AM</div>
</div>

<div class="c caps" style="top:1020px;font-size:34px;color:#4f3426">Tea Plan</div>
<div class="c caps" style="top:1068px;font-size:22px">Bacolod City</div>
<div class="c script" style="top:1132px;font-size:58px;color:#8c6a45">Reception to follow</div>
<div class="c" style="top:1214px;font-style:italic;font-size:28px;color:#6b4e3a">We can't wait to celebrate with you</div>

<script>
// Shapes shared with src/components/site/Decor.tsx (balloons, roses, pampas, butterfly)
const TONES={rose:["#ecd0cf","#d3a3a6","#b48085"],blush:["#fbeae6","#efcdc8","#d6aba6"],ivory:["#fffcf7","#f5ebe0","#ddcbb8"],nude:["#f5e6d7","#e2c6ac","#c4a284"],gold:["#fbecbd","#d2ae64","#8f6a2c"]};
let seed=11;const rand=()=>{seed=(seed+0x6d2b79f5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
let defs=Object.entries(TONES).map(([t,[a,b,c]])=>`<radialGradient id="g-${t}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset="${t==='gold'?.45:.55}" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`).join("")
  +`<linearGradient id="wing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f6e2bf"/></linearGradient>`
  +`<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#ffd896" flood-opacity=".9"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
const tones=["rose","ivory","blush","nude","gold","ivory","rose","blush"];
function garland(pts,size){const out=[];pts.forEach(([x,y],i)=>{out.push([x,y,(16+rand()*12)*size,tones[i%8]]);const a=rand()*Math.PI*2;out.push([x+Math.cos(a)*20*size,y+Math.sin(a)*20*size,(7+rand()*6)*size,tones[(i+3)%8]])});return out.sort((p,q)=>q[2]-p[2])}
const balloons=b=>b.map(([x,y,r,t])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#g-${t})"/><ellipse cx="${x-r*.35}" cy="${y-r*.4}" rx="${r*.22}" ry="${r*.13}" transform="rotate(-35 ${x-r*.35} ${y-r*.4})" fill="#fff" opacity="${t==='gold'?.85:.55}"/>`).join("");
function rose(x,y,r,w=true){const [f,e]=w?["#fffaf2","#dccab6"]:["#f0cfca","#c99a96"];return `<g stroke="${e}" stroke-width="1.4" stroke-linecap="round"><circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/><path d="M${x-r*.75} ${y+r*.1}c${r*.1} ${-r*.8} ${r*1.3} ${-r*.9} ${r*1.45} ${-r*.1}" fill="none"/><path d="M${x-r*.5} ${y+r*.35}c${r*.2} ${r*.4} ${r*.9} ${r*.4} ${r*1.05} ${-r*.1}" fill="none"/><path d="M${x-r*.3} ${y}c0 ${-r*.45} ${r*.6} ${-r*.45} ${r*.6} 0s${-r*.3} ${r*.3} ${-r*.35} ${r*.05}" fill="none"/></g>`}
function pampas([x0,y0,cx,cy,x1,y1],n=26){const at=t=>[(1-t)**2*x0+2*(1-t)*t*cx+t*t*x1,(1-t)**2*y0+2*(1-t)*t*cy+t*t*y1];let d="";for(let i=0;i<n;i++){const t=.35+i/n*.65;const[px,py]=at(t),[qx,qy]=at(Math.min(1,t+.02));const a=Math.atan2(qy-py,qx-px);const len=16*Math.sin(Math.PI*Math.min(1,(t-.3)/.75))+5;const s=i%2?1:-1;d+=`M${px} ${py}L${px+Math.cos(a+s*.9)*len} ${py+Math.sin(a+s*.9)*len}`}return `<g fill="none" stroke="#c8a67e" stroke-linecap="round"><path d="M${x0} ${y0}Q${cx} ${cy} ${x1} ${y1}" stroke-width="1.8"/><path d="${d}" stroke-width="2.6" opacity=".75"/></g>`}
function spray(tx,ty,sc,flip){const g=[pampas([110,110,80,50,40,6]),pampas([112,112,150,60,200,30],20),pampas([106,116,60,110,8,96],18),
 `<g fill="#b9b896" opacity=".8"><ellipse cx="74" cy="128" rx="11" ry="4.5" transform="rotate(25 74 128)"/><ellipse cx="150" cy="132" rx="11" ry="4.5" transform="rotate(-20 150 132)"/></g>`,
 rose(96,110,20),rose(130,104,16,false),rose(114,136,15),rose(76,96,12,false),rose(150,124,11),
 [[60,80],[70,66],[150,84],[164,98],[90,76],[140,146],[84,140],[170,116],[58,110],[104,82]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.2" fill="#fff" stroke="#e7d6c6" stroke-width=".6"/><circle cx="${x}" cy="${y}" r=".9" fill="#e3b5b8"/>`).join("")].join("");
 return `<g transform="translate(${tx} ${ty}) scale(${flip?-sc:sc} ${sc})">${g}</g>`}
const butterfly=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" filter="url(#glow)"><path d="M32 24C26 8 8 6 10 17c2 8 13 9 22 7zM32 24c6-16 24-18 22-7-2 8-13 9-22 7zM32 24c-6 4-15 13-9 16 4 2 8-6 9-16zM32 24c6 4 15 13 9 16-4 2-8-6-9-16z" fill="url(#wing)" stroke="#c9a45c" stroke-width="1"/><path d="M32 17v16M32 17l-3-5M32 17l3-5" stroke="#c9a45c" stroke-width="1.1" fill="none"/></g>`;
// garland up the right side of the arch and over its shoulder, plus a cluster at the bottom left
const right=garland([[820,1340],[838,1290],[812,1240],[836,1190],[816,1140],[840,1090],[818,1040],[838,990],[814,940],[836,890],[818,840],[832,790],[812,740],[828,690],[808,640],[818,590],[800,540],[804,490],[786,440],[784,392],[764,348],[746,306],[722,268]],1.9);
seed=4;const left=garland([[150,1350],[118,1330],[176,1376],[96,1290],[130,1260]],1.9);
document.getElementById("decor").innerHTML=`<defs>${defs}</defs>${spray(-10,20,1.75,false)}${balloons(right)}${balloons(left)}${spray(940,1250,1.4,true)}${butterfly(70,560,1.6)}${butterfly(830,160,1.1)}`;
</script>
</body></html>
