<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 1920px; overflow: hidden; }
  body { font-family: "Cormorant Garamond", serif; color: #5c3a63; position: relative; text-align: center;
    background:
      radial-gradient(520px 460px at 8% 10%, #f3d3e4, transparent 70%),
      radial-gradient(560px 520px at 100% 30%, #e4d3f0, transparent 70%),
      radial-gradient(600px 520px at 0% 88%, #ead7f3, transparent 70%),
      radial-gradient(520px 460px at 100% 100%, #f6dde8, transparent 70%),
      #fcf4f9; }
  .frame { position: absolute; inset: 44px; border: 2px solid rgba(154,106,160,.35); border-radius: 18px; }
  .frame2 { position: absolute; inset: 60px; border: 1px solid rgba(154,106,160,.25); border-radius: 12px; }
  .ey { font-size: 46px; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; color: #7d5585; }
  .script { font-family: "Allura"; color: #9a6aa0; line-height: .95; }
  .rule { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 36px 0; }
  .rule i { width: 190px; height: 2px; background: #b691bd; }
  .rule svg { width: 44px; color: #9a6aa0; }
  .det { font-size: 54px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; line-height: 1.6; color: #6b4772; }
  .intro { font-style: italic; font-size: 52px; line-height: 1.35; color: #6b4772; }
  .deco { position: absolute; color: #9a6aa0; }
  .sprig circle { fill: #fff; stroke: #c7a5cf; stroke-width: 1.4; }
</style>
</head>
<body>
<div class="frame"></div><div class="frame2"></div>

<svg class="deco" style="left:120px;top:150px;width:170px" viewBox="0 0 64 48"><path d="M32 24C26 8 8 6 10 17c2 8 13 9 22 7zM32 24c6-16 24-18 22-7-2 8-13 9-22 7zM32 24c-6 4-15 13-9 16 4 2 8-6 9-16zM32 24c6 4 15 13 9 16-4 2-8-6-9-16z" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M32 17v16M32 17l-3-5M32 17l3-5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none"/></svg>
<svg class="deco" style="right:150px;top:1690px;width:110px;transform:rotate(14deg)" viewBox="0 0 64 48"><path d="M32 24C26 8 8 6 10 17c2 8 13 9 22 7zM32 24c6-16 24-18 22-7-2 8-13 9-22 7zM32 24c-6 4-15 13-9 16 4 2 8-6 9-16zM32 24c6 4 15 13 9 16-4 2-8-6-9-16z" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/><path d="M32 17v16M32 17l-3-5M32 17l3-5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" fill="none"/></svg>
<svg class="deco" style="right:150px;top:240px;width:70px" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2C4.5 7.4 6.6 5.5 9 5.5c1.4 0 2.5.7 3 1.7.5-1 1.6-1.7 3-1.7 2.4 0 4.5 1.9 4.5 4.8 0 5.6-7.5 10.2-7.5 10.2z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.1"/></svg>
<svg class="deco" style="left:170px;top:1720px;width:56px" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2C4.5 7.4 6.6 5.5 9 5.5c1.4 0 2.5.7 3 1.7.5-1 1.6-1.7 3-1.7 2.4 0 4.5 1.9 4.5 4.8 0 5.6-7.5 10.2-7.5 10.2z" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.1"/></svg>
<svg class="deco sprig" id="sp1" style="left:70px;top:1180px;width:200px;height:470px" viewBox="0 0 110 260"></svg>
<svg class="deco sprig" id="sp2" style="right:70px;top:1180px;width:200px;height:470px;transform:scaleX(-1)" viewBox="0 0 110 260"></svg>

<div style="position:absolute;left:0;right:0;top:260px">
  <div class="ey">You're invited to a</div>
  <div class="script" style="font-size:200px;margin-top:40px">Sweet Sixteen</div>
  <div class="ey" style="font-size:40px;margin-top:40px">celebration for</div>
  <div class="script" style="font-size:210px;margin-top:20px">Amelia Rose</div>
  <div class="rule"><i></i><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2C4.5 7.4 6.6 5.5 9 5.5c1.4 0 2.5.7 3 1.7.5-1 1.6-1.7 3-1.7 2.4 0 4.5 1.9 4.5 4.8 0 5.6-7.5 10.2-7.5 10.2z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><i></i></div>
  <div class="intro">Join us for an evening of love,<br>good food and great company.</div>
  <div class="det" style="margin-top:70px">Saturday, May 23<br>6:00 PM<br>The Garden Pavilion</div>
  <div class="script" style="font-size:96px;margin-top:70px">We can't wait to see you!</div>
</div>

<script>
// baby's breath sprigs: a stem with little five-dot blossoms
function sprig(id) {
  let s = '<path d="M20 255 C40 190 50 120 90 10" stroke="#a98bb0" stroke-width="1.6" fill="none"/>';
  const pts = [[90,10],[78,40],[96,46],[66,72],[86,88],[56,110],[74,128],[48,150],[64,168],[40,192],[56,206],[32,228]];
  pts.forEach(([x, y], i) => {
    s += `<path d="M${x} ${y} L${x - (i % 2 ? -10 : 10)} ${y + 12}" stroke="#a98bb0" stroke-width="1" fill="none"/>`;
    for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; s += `<circle cx="${x + Math.cos(a) * 4.5}" cy="${y + Math.sin(a) * 4.5}" r="3.4"/>`; }
    s += `<circle cx="${x}" cy="${y}" r="1.8" style="fill:#e7c9ea;stroke:none"/>`;
  });
  document.getElementById(id).innerHTML = s;
}
sprig("sp1"); sprig("sp2");
</script>
</body>
</html>
