<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%239a6aa0' d='M16 28s-11-6.6-11-14.2C5 9.4 8 6.5 11.6 6.5c2 0 3.6 1 4.4 2.5.8-1.5 2.4-2.5 4.4-2.5C24 6.5 27 9.4 27 13.8 27 21.4 16 28 16 28z'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="description" content="%META_DESCRIPTION%" />
    <title>%PAGE_TITLE%</title>

    <!-- Link previews on Facebook, Messenger, Viber, WhatsApp and X.
         %SITE_URL% is filled in at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%PAGE_TITLE%" />
    <meta property="og:description" content="%META_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PAGE_TITLE%" />
    <meta name="twitter:description" content="%META_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
