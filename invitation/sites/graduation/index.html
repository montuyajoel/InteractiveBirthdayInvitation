    <meta property="og:title" content="Joaquin's Graduation Celebration" />
    <meta property="og:description" content="Join us as we celebrate Joaquin's BS in Computer Science, cum laude." />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joaquin's Graduation Celebration" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/share.jpg" />
